<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The "o" from the logo. White half on dark tabs, black on light ones, so it never disappears. -->
  <style>.ink { stop-color: #fff } @media (prefers-color-scheme: light) { .ink { stop-color: #000 } }</style>
  <defs>
    <linearGradient id="o" x1="0" y1="0" x2="1" y2="1">
      <stop class="ink" offset="0"/>
      <stop class="ink" offset="0.5"/>
      <stop offset="0.5" stop-color="#1A4FA3"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#o)"/>
</svg>
